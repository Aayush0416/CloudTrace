<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>CloudTrace</title>
    <script>
      // Apply the saved theme before React renders, so there is no flash of the wrong theme.
      try {
        var p = JSON.parse(localStorage.getItem("ct_prefs") || "{}");
        var t = p.theme || "dark";
        if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.density = p.density || "comfortable";
        if (p.reduceMotion) document.documentElement.dataset.motion = "reduce";
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#14213D" : "#000000");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
